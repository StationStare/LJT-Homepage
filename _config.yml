# Basic Site Settings
locale: 'en-US'
site_theme: 'default'
title: 'Junteng Liu'
title_separator: '-'
name: 'Junteng Liu'
description: 'First-year PhD candidate at HKUST NLP Group researching natural language processing and machine learning, with interests in LLM reasoning and reinforcement learning, VLM hallucination, and LLM truthfulness and interpretability.'
url: 'https://stationstare.github.io'
baseurl: '/LJT-Homepage'
repository: 'StationStare/LJT-Homepage'

# Site Author
author:
  avatar: 'junteng-liu-avatar.svg'
  name: 'Junteng Liu'
  bio: 'First-year PhD candidate at HKUST NLP Group. Research focuses on natural language processing and machine learning; interests include LLM reasoning and reinforcement learning, hallucination in Vision-Language Models (VLM), and LLM truthfulness and interpretability.'
  employer: 'HKUST NLP Group, Hong Kong University of Science and Technology'
  email: 'jliugi@connect.ust.hk'
  googlescholar: 'https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate'
  github: 'Vicent0205'
  twitter: 'junteng88716710'

# Publication categories
publication_category:
  manuscripts:
    title: 'arXiv'
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser:
breadcrumbs: false
words_per_minute: 160
future: true
read_more: 'disabled'
talkmap_link: false
comments:
  provider: false
atom_feed:
  hide: false
  path:

# Social Sharing
twitter:
  username: 'junteng88716710'
og_image:
og_description:

# Analytics
analytics:
  provider: false

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - '*.sublime-project'
  - '*.sublime-workspace'
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: 'utf-8'
markdown_ext: 'markdown,mkdown,mkdn,mkd,md'

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  header_links: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ''
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ''
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  comments: ['<!-- ', ' -->']
  ignore:
    envs: development
