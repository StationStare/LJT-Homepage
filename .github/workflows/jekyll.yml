# Workflow for building and deploying an Academic Pages / Jekyll site to GitHub Pages
name: Deploy Academic Pages site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Verify generated About content
        shell: bash
        run: |
          set -e
          test -f _site/index.html
          for term in 'Junteng Liu' 'First-year PhD candidate' 'HKUST NLP Group' 'Professor Junxian He' 'Shanghai Jiao Tong University' 'June 2024' 'B.Eng.' 'Zhiyuan Honor Scholarship' 'MINIMAX' 'February 2025' 'Tencent WXG' 'Zifei Shan' 'Shanghai AI Lab' 'Yu Cheng' 'Natural language processing' 'Machine learning' 'reinforcement learning' 'Vision-Language Models' 'truthfulness and interpretability' 'jliugi@connect.ust.hk' 'Vicent0205' 'tbK9jl4AAAAJ' 'junteng88716710' 'SynLogic' 'Perception Bottleneck' 'Universal Truthfulness Hyperplane' 'In-Context Sharpness' 'C-Eval' 'Composing Parameter-Efficient'; do
            grep -Fq "$term" _site/index.html || { echo "Missing on About: $term"; exit 1; }
          done
          echo 'About content checks passed.'
      - name: Verify generated Publications content
        shell: bash
        run: |
          set -e
          test -f _site/publications/index.html
          for term in 'Junteng Liu' 'SynLogic' 'Perception Bottleneck' 'Universal Truthfulness Hyperplane' 'EMNLP 2024' 'In-Context Sharpness' 'ICML 2024' 'C-Eval' 'NeurIPS 2023' 'Composing Parameter-Efficient' 'Vision4Chart' 'Universal_Truthfulness_Hyperplane' 'Yuanxiang Fan' 'Yuzhen Huang'; do
            grep -Fq "$term" _site/publications/index.html || { echo "Missing on Publications: $term"; exit 1; }
          done
          echo 'Publications content checks passed.'
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
